name: Train and Evaluate Model

on:
  push:
    branches:
      - main
      - dev

jobs:
  train-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip" # optional but good for speeding up workflow

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Q-learning v1
        run: python train.py --config configs/qlearning_v1.yaml

      - name: Train Q-learning v2
        run: python train.py --config configs/qlearning_v2.yaml

      - name: Evaluate policy v1
        run: python evaluate.py --policy policies/policy_v1.pkl

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hvac-rl-artifacts
          path: |
            experiments/
            policies/
